<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D&D Battle Cards</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="no-print">
  <h1>⚔ D&amp;D Battle Cards</h1>
  <div class="io">
    <button id="export">Export JSON</button>
    <label class="btn">Import JSON<input type="file" id="import" accept="application/json" hidden></label>
    <button id="settings-btn" title="Global Settings">⚙</button>
  </div>
</header>

<!-- ========== MAIN LAYOUT ========== -->
<main class="app-layout">
  <section class="list-section no-print">
    <button id="new-char" class="primary">+ New Character</button>
    <ul id="char-list"></ul>
  </section>
  <div id="empty-hint" class="form-pane no-print" style="display:none">
    <p class="hint-text">← Start by adding a new character</p>
  </div>
  <form id="char-form" class="form-pane no-print" style="display:none">
     <label>Name <input name="name" required></label>
    <div class="row">
      <label>Class
        <select name="class" id="class-select"></select>
      </label>
      <label>Level <input name="level" type="number" min="1" max="20" value="1"></label>
      <label>AC <input name="ac"></label>
      <label>Max HP <input name="hp" type="number" min="1"></label>
      <label>Speed <input name="speed" value="30"></label>
    </div>
    <label>Resist / Immune / Vulnerable <input name="resist" placeholder="Resist: fire · Immune: poison"></label>
    <label class="inline"><input type="checkbox" name="isSpellcaster"> Is Spellcaster</label>
    <fieldset id="spellcasting-field" hidden>
      <legend>Spellcasting</legend>
      <div class="row spell-row">
        <label>Spell Save DC <input name="spellSaveDC"></label>
        <label>Spell Attack <input name="spellAttack"></label>
        <label>Spell Mod <input name="spellMod"></label>
      </div>
    </fieldset>
    <fieldset id="spellslots-field" hidden>
      <legend>Spell Slots</legend>
      <label class="inline"><input type="checkbox" name="autoSlots" checked> Auto-fill from class &amp; level</label>
      <div id="manual-slots" hidden></div>
    </fieldset>

    <fieldset id="resource-field">
      <legend>Class Resources</legend>
      <div id="resources-list"></div>
      <button type="button" id="add-resource">+ Add Resource</button>
    </fieldset>

    <div class="actions">
      <button type="submit" class="primary">Save</button>
      <button type="button" id="delete-char" class="danger">Delete</button>
      <button type="button" id="cancel-edit">Cancel</button>
    </div>
  </form>
  <section class="battle-panel">
    <div id="pick-list" class="pick-list no-print"></div>

    <div id="print-area" class="layout-6">
      <div id="cards"></div>
    </div>
  </section>
</main>

<div id="settings-overlay" class="no-print" hidden>
  <div class="settings-dialog">
    <div class="settings-header">
      <h2>Global Settings</h2>
      <button id="close-settings" title="Close">✕</button>
    </div>
    <div class="settings-content">
      <label>Bardic Inspiration Die
        <select id="bardic-die-setting">
          <option value="d6">d6</option>
          <option value="d8">d8</option>
          <option value="d10">d10</option>
          <option value="d12">d12</option>
        </select>
      </label>
      <label>Layout
        <select id="layout-setting">
          <option value="6">6-up (3×2)</option>
          <option value="4">4-up (2×2)</option>
          <option value="2">2-up (1×2)</option>
        </select>
      </label>
    </div>
  </div>
</div>

<script src="classes.js"></script>
<script src="app.js"></script>
</body>
</html>
